  <body>
    <!-- Filtre SVG de refraction "liquid glass" : feTurbulence -> feDisplacementMap
         deforme ce qui est peint derriere le verre (effet de lentille realiste).
         Reference en backdrop-filter: url(#liquid-glass) dans glass.css. -->
    <svg class="liquid-defs" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <filter id="liquid-glass" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="7" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="1.1" result="softNoise" />
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="16" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
